# Codecov settings: https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # Report coverage on PRs without failing them when it drops.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  # Test code, not code under test.
  - "ceres-test-runner"
  - "**/tests.rs"
  - "**/tests"
