# GitHub Actions workflow for Ceres testing
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  # Codecov checks uploads against GitHub's OIDC token, so no secret is needed.
  id-token: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The tests only need the boot ROMs; the other submodules are reference
      # code and documentation.
      - name: Check out the boot ROM sources
        run: git submodule update --init --recursive external/gb-bootroms

      - name: Cache RGBDS
        id: cache-rgbds
        uses: actions/cache@v4
        with:
          path: ~/rgbds
          key: rgbds-linux-x86_64-latest

      - name: Download RGBDS
        if: steps.cache-rgbds.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/gbdev/rgbds/releases/latest/download/rgbds-linux-x86_64.tar.xz
          mkdir -p ~/rgbds
          tar xf rgbds-linux-x86_64.tar.xz -C ~/rgbds

      - name: Install RGBDS
        run: |
          cd ~/rgbds
          sudo ./install.sh

      - name: Verify RGBDS installation
        run: rgbasm -V

      - name: Build boot ROMs
        run: |
          cd external/gb-bootroms
          make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo registry cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cache-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Cache test ROMs
        uses: actions/cache@v4
        with:
          path: external/test-roms
          key: test-roms-v7.0

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      # nextest runs each test in its own process: threads sharing one
      # process would fight over the coverage counters. Release builds keep
      # the ROM tests fast and count the same lines.
      - name: Run tests with coverage
        run: >
          cargo llvm-cov nextest --release
          --package ceres-core --package ceres-test-runner
          --lcov --output-path lcov.info
        # Note: Test ROMs are automatically downloaded by the build script

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
