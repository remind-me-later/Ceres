# GitHub Actions workflow for the gate-level VHDL model (hdl/): tests the
# generator, generates the model from its submodules, analyses it with nvc,
# and simulates the first 33 ms from power-on, whose pin trace must match
# the one checked against dmg-sim (hdl/smoke.sha256). Test ROM runs take
# hours and stay local (hdl/run-tests.sh).
name: HDL

on:
  push:
    branches: [main]
    paths:
      - "hdl/**"
      - "ceres-hdlgen/**"
      - "external/docs/dmg-schematics"
      - "external/reference-implementations/dmg-sim"
      - ".github/workflows/hdl.yml"
  pull_request:
    branches: [main]
    paths:
      - "hdl/**"
      - "ceres-hdlgen/**"
      - "external/docs/dmg-schematics"
      - "external/reference-implementations/dmg-sim"
      - ".github/workflows/hdl.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Gate-level model (nvc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0

      # The model needs the netlist and dmg-sim (for its cells and its
      # quickboot ROM). Their URLs are SSH ones, so fetch them over HTTPS.
      - name: Check out the netlist and dmg-sim
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init \
            external/docs/dmg-schematics external/reference-implementations/dmg-sim

      - uses: dtolnay/rust-toolchain@stable

      # The version is pinned: change it to update, and check the smoke
      # trace against dmg-sim again (hdl/README.md).
      - name: Install nvc
        uses: nickg/setup-nvc@v1
        with:
          version: "1.23.0"

      - name: Test the generator
        run: cargo test -p ceres-hdlgen

      - name: Generate and analyse the model
        run: make -C hdl

      - name: Simulate 33 ms and check the pin trace
        run: make -C hdl smoke
