# What is known about the hardware where it is not simply known.
#
# One table per behaviour whose evidence is missing or contradictory, where
# ceres departs from the DMG-CPU B's netlist, or whose outcome hangs on a
# race. Behaviours that the netlist, the hardware-verified tests and ceres
# all agree on are not listed. Code that implements or depends on a fact
# says so with a tag, `@fact <id>`, in a comment.
#
# Fields:
#
# - title: the behaviour, in a line.
# - models: dmg, mgb, sgb, cgb, cgb-c, cgb-e.
# - netlist: what the netlist (hdl/rtl, dmg-sim) does, against ceres: same,
#   differs, silent (it cannot tell: two drivers, the RAMs' cells, the
#   power-on state, the analogue side) or none (no netlist: CGB only).
# - hardware: what the hardware-verified test ROMs in `tests` show, against
#   ceres: same, differs, or none (no test looks).
# - emulators (optional): agree if SameBoy and Gambatte do what ceres
#   does, disagree if not, where that is all the evidence there is.
# - race (optional): the outcome hangs on which of two signals comes first;
#   order if they are a phase or more apart, width if the die's physics
#   decides (a pulse of almost no width, two paths of almost one delay).
# - tests: test ROMs or their directories, under external/test-roms.
# - open: the open questions of doc/hardware-tests.md that would settle it,
#   as document#anchor.
# - needs: what settling them takes: flash-cart, logic-analyser-lcd,
#   logic-analyser-cartridge, scope, camera, decap (a chip opened and
#   photographed), the units (dmg-b, dmg-c, cgb-c, cgb-e) or several-units.
# - note (optional): what the fields do not say.
#
# The test `facts` of ceres-test-runner checks that a departure from the
# netlist rests on a hardware test or an open question, that ceres failing
# a hardware test has an open question, that the ROMs and the anchors
# exist, that every open question of those documents is a fact's, and that
# every tag names a fact. `cargo run -p ceres-test-runner --example facts`
# prints the open questions, the departures from the netlist and the races.

