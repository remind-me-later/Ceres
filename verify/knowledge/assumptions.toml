# What the proofs against the netlist assume.
#
# ceres-core's Kani harnesses prove ceres's blocks alike to Rust
# transcriptions of the readable model (hdl/rtl), which is checked against
# dmg-sim, the DMG-CPU B's netlist. Each proof takes some things as given:
# that a transcription is the model, how ceres's time maps onto the
# netlist's, the differences the facts record, the cases it leaves out. One
# table per such assumption. A harness names what it rests on with a tag in
# the comment before its `fn`, `@assumes <id>`, and what it proves for the
# others with `@discharges <id>`.
#
# Fields:
#
# - title: the assumption, in a line.
# - evidence: proved (a harness discharges it), typed (ceres's types leave
#   no other way: the compiler checks it), replayed (a transcription, which
#   ceres-netlist's netlist_replay checks against the model's traces),
#   measured (on the model's traces, ceres's runs or hardware), fact (ceres
#   departs from the netlist there, as the facts record) or open (not known
#   yet: the proofs leave the case out).
# - how: how it was replayed or measured, or what leaves it open (all but
#   proved).
# - facts (optional): the facts of verify/knowledge/facts.toml it rests on (fact).
# - rests_on (optional): the assumptions it takes as given in turn.
#
# The knowledge base (verify/knowledge/knowledge.sh, knowledge/knowledge.dl) follows
# them from harness to harness: an assumption that a harness discharges
# brings in what that harness rests on. `knowledge.sh check` finds the tags
# and fields that name nothing, the netlist harnesses that state nothing,
# the proved assumptions no harness proves, and the proofs that rest on
# what they prove; `knowledge.sh assumptions` lists what each harness rests
# on, and `knowledge.sh open-assumptions` the open ones.

# The readable model and its transcriptions

[readable-model-is-dmg-sim]
title = "The readable model (hdl/rtl) does what dmg-sim, the DMG-CPU B's netlist, does"
evidence = "measured"
how = "make check: board/chip_tb.vhd compares the model with dmg-sim's recorded signals, phase by phase, for every test in build/runs (ceres-netlist/README.md)."

[transcription-timer]
title = "NetTimer is divider.vhd and timer.vhd, phase by phase"
evidence = "replayed"
how = "netlist_replay over the timer and interrupt ROMs' traces (gbmicrotest, Mooneye, Gambatte): no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-if]
title = "NetIf is interrupts.vhd and the request latch and acknowledge of sm83_interrupts.vhd, phase by phase"
evidence = "replayed"
how = "netlist_replay over the timer and interrupt ROMs' traces: no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-dma]
title = "NetDma is dma.vhd, phase by phase, clocked by dma_phi"
evidence = "replayed"
how = "netlist_replay over 169 ROMs' traces: no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-lcd]
title = "NetLcd is lcd_timing.vhd's line clock, LY, VBlank, LY = LYC, LYC's and STAT's latches and the STAT line, edge by edge"
evidence = "replayed"
how = "netlist_replay over 169 gbmicrotest LCD ROMs (50.8 million phases), and the sprite, OAM and late_sizechange ROMs: no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-lcd-control]
title = "NetLcdControl is lcd_control.vhd's LCDC latches, whose bit 7 holds the line timing in reset, as NetChip applies it (the clock's flip-flops held, LYC, the enables and the flag kept)"
evidence = "replayed"
how = "netlist_replay's replay of the whole chip (NetChip, in which LCDC holds the line timing and the scan in reset) over the model's traces that have render's, the core's and the APU's fields."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-scan]
title = "NetScan is oam_scan.vhd, edge by edge, on NetLcd's clocks"
evidence = "replayed"
how = "netlist_replay over the 123 ROMs traced with the scan (73,950 saves, 147,423 stops): no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-oam-latches]
title = "NetOamLatches is oam.vhd's two stages of latches of the Y, while the CPU does not address OAM"
evidence = "replayed"
how = "netlist_replay over the 123 ROMs traced with the scan, the phases where the CPU addresses OAM left out (its read strobe is not traced): no difference."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-render-edge]
title = "NetPipeline is NetRender's background pipeline, sprite fetch and window (the pixel counter, the fetcher's count, the first fetch's flip-flops, the fine scroll, mode 3's latch, SCX, the sprite store's X and fetched slots, the fetch's steps, WY and WX, the window's matches, counters and start), edge by edge, while the scan saves no sprite, but at the edge where the LCD's reset rises in mode 3"
evidence = "replayed"
how = "ceres-netlist's tests/render_edge.rs steps it from NetRender's state at every edge of NetChip's runs where the OAM scan saves no sprite, and compares it with NetRender's after the edge: 803 ROMs (hdl/tests.txt, gambatte's scx_during_m3, scy, sprites, window, m0int_m0stat, m2int_m3stat, m0enable, bgen, dmgpalette_during_m3 and enable_display, mealybug's ppu ROMs, gbmicrotest, dmg-acid2, mooneye's ppu tests), 0.2 s each: 1,349,372,892 edges, 401,151,682 in mode 3, 89,648,743 with the window (198 ROMs), with 38,826 sprite fetches and 181,702 SCX writes, no difference. tests/render_edge_free.rs does the same from states no ROM reaches (2000 runs of three lines from power-on, with random LCDC, sprite X, CPU writes of SCX, WY and WX, and resets held as levels: 5,471,000 edges, no difference) and found the exception: at the edge where the LCD's reset rises while mode 3 runs, render's fetcher restart still sees mode 3 in the delta before the reset clears it and clears the fetcher's count, where the pipeline clears mode 3 first (56 of 1000 such edges differ; the proofs take no reset in mode 3, and the ROMs' runs turn the LCD off outside it). NetRender, the delta-cycle transcription of render.vhd, is what netlist_replay replays through render's traces."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-sm83]
title = "NetCore is sm83.vhd and its parts (the sequencer, the decoder and its control lines, the registers, the ALU, the IDU, IE and the interrupts' selection), phase by phase"
evidence = "replayed"
how = "netlist_replay's replay of the core over the model's traces that have its fields, alone and in the whole chip (NetChip)."
rests_on = ["readable-model-is-dmg-sim"]

[transcription-bus]
title = "NetBus is external_bus.vhd, high_ram.vhd, boot_rom.vhd, joypad.vhd and serial.vhd, phase by phase, and NetBoard the board's work RAM and cartridge"
evidence = "replayed"
how = "netlist_replay over the 269 traces with the bus side's fields (ceres-netlist/README.md): no difference, with 16 million reads on the cartridge bus, 400 thousand writes of HRAM and 189 serial transfers."
rests_on = ["readable-model-is-dmg-sim"]

[dmg-undecoded-io]
title = "No block of the DMG decodes FF03, FF08 to FF0E, FF15, FF1F, FF27 to FF2F, FF4C to FF4F or FF51 to FF7F (memory::undecoded): a read finds the precharged bus, FF, and a write changes nothing"
evidence = "measured"
how = "Read from hdl/rtl: every FFxx address a block of the DMG's revision decodes, for a read or a write; FF60, the test register, is written only with a test pin high and has no read. The CGB's registers (cgb_mode.vhd, speed_switch.vhd, colour_palettes.vhd, wram_bank.vhd, vram_bus.vhd's FF4F) are not on the DMG-CPU B."
rests_on = ["readable-model-is-dmg-sim"]

# How ceres's time maps onto the netlist's)

[mapping-m-cycle-at-e]
title = "Ceres's M-cycle starts at the netlist's E: an IF write lands after its first T-cycle, an interrupt's acknowledge after its second, a source's rise in T-cycle 1, 2 or 3-4 is the netlist's in E-G, H or A-D"
evidence = "measured"
how = "The model's traces of m2m1irq_ifw_3 and of the timer ROMs: line 144's STAT rise at D (ceres's T4), VBlank's at H (T2)."
rests_on = ["readable-model-is-dmg-sim"]

[mapping-timer-a-edge]
title = "The netlist's A edge falls in ceres's third or fourth T-cycle: the divider counts in the fourth, the timer's interrupt in the third"
evidence = "measured"
how = "The model's traces of the timer ROMs, which the timer's replay follows phase by phase."
rests_on = ["readable-model-is-dmg-sim"]

[mapping-dma-step-at-a]
title = "Ceres's OAM DMA steps in the M-cycle's third T-cycle, at the netlist's A edge, as dma_phi rises"
evidence = "measured"
how = "The model's DMA traces (169 ROMs), which the DMA's replay follows by dma_phi."
rests_on = ["readable-model-is-dmg-sim"]

[dma-one-run-per-m-cycle]
title = "Ceres runs its OAM DMA once per M-cycle, over its four T-cycles, as when the CPU accesses memory in every M-cycle"
evidence = "open"
how = "The DMA's proof models Gb::run_dma so; M-cycles split around other accesses, the halt and the speed switch are not modelled."

[mapping-half-dot]
title = "Ceres's half dot is a clock edge of the netlist: D is h = 0 (mod 8), E 1, H 4; vclk rises at 904"
evidence = "measured"
how = "netlist_replay's traces of 169 gbmicrotest LCD ROMs, against ceres's LcdTiming."
rests_on = ["readable-model-is-dmg-sim"]

[mapping-access-at-h0]
title = "Ceres's CPU accesses to STAT, LY and LYC fall at h = 0 (mod 8), and at h = 2 in the first line after the LCD is turned on, until the resync: the netlist's D edge"
evidence = "measured"
how = "All 28 accesses to these registers in 60 gbmicrotest ROMs; in that first line, 35 at h = 2."

[mapping-lcdc-write]
title = "Ceres lands a DMG LCDC write 2 half dots before its access (OBJ_SIZE with DmgLcdc's second write); the netlist's latch opens in E"
evidence = "measured"
how = "Ceres's writes at h = 8m + 6 (temporary prints over six late_sizechange runs); all 46 changes of LCDC bit 2 in the model's traces in E."
rests_on = ["readable-model-is-dmg-sim"]

[mapping-scan-reads]
title = "Ceres's object search reads sprite i at half dot 4i - 3 of the line"
evidence = "measured"
how = "All 677,840 reads of six runs of late_sizechange ROMs (temporary prints); the state machine is outside the proofs."

[mapping-scan-dma-order]
title = "Ceres's object search, reading at the A edge, sees its OAM DMA as before that edge's step"
evidence = "measured"
how = "Gambatte's DMG late_sp traces: the run rose in index k's window and ceres hid from sprite k + 1 (k = 0, 2, 38), fell there and ceres hid up to k (k = 0, 2)."

[mapping-mode3-end]
title = "Render's mode 0 rises a half dot after ceres's pixel pipeline ends mode 3 (timing_mode3_end), on an even half dot of a visible line, before its end, and its mode 3 latch (XYMU) falls the edge after, through VOGA; mode 0 falls at the scan's line start (h = 906), but after line 143, where VBlank masks it; it pulses only for a sprite at X 167"
evidence = "measured"
how = "Model traces of 13 ROMs (gbmicrotest's hblank_int_scx0 to 7, gambatte's sprite m0irq, m0stat and m3stat ROMs) against ceres's timing_mode3_end (a temporary trace event): 11,020 lines a half dot after, 23 in line 0 after the LCD is turned on (ceres 2 half dots ahead), and 14 with a sprite at X 167 pulsing; rises at h = 500 to 720, all even; 12,859 falls at 906 and 85 at line 143's 908. XYMU: all 58,663 lines of ceres-netlist's tests/vram_gate.rs fall one edge after mode 0 (a temporary count); on ceres's clock, which reads 2 more in line 0 after the LCD is turned on, the fall is 2 half dots after timing_mode3_end there too (ceres-test-runner's tests/vram_gate.rs: the reads around it have the netlist tally's patterns). Proved for the lines where the window is idle, with objects at X 8 or more (mode3-end-background)."
rests_on = ["readable-model-is-dmg-sim"]
facts = ["sprite-at-167-mode-0-pulse"]

[mapping-mode3-start]
title = "On a visible line, but line 0 after the LCD is turned on, ceres's mode 3 loop starts at h = 163 with its position at -16 and no blank pixel inserted, where render's mode 3 rose at h = 154 and its pipeline is as background::relation::before_start has it at h = 162 (the sprite fetch at rest), whatever SCX is and whatever sprites the scan found, the window idle or armed (its WY latches the frame's)"
evidence = "measured"
how = "The netlist: tests/render_edge.rs over the 638 ROMs of transcription-render-edge, 868,141 line starts with the window idle, all rising at 154 and as before_start at 162. With the window armed (WY matched in the frame, not started): the same test over Gambatte's 203 DMG window ROMs and Mealybug's 2 m3_window ROMs, 458,684 line starts, 18,924 armed, all rising at 154 and as before_start at 162 with the frame's WY latches (task 1.3). Ceres: the first tile fetch of each line (the loop's first dot) over 508 of those ROMs, 12 frames each: 596,900 lines after line 0 and 4,064 line 0s at h = 163, and 508 line 0s after the LCD was turned on at 169. Mode3Start follows OamScanObject's fixed sleeps, and end_line or the first line puts the position back at -16."
rests_on = ["readable-model-is-dmg-sim"]

[mapping-scx-write]
title = "On the DMG, a CPU write that changes SCX's low bits reaches ceres's pixel mixer from the dot at h = H - 2, where the netlist's write strobe on SCX's address rises at H with the clock (H = 1 mod 8) and stays up three edges with the value on the data bus; the edge before carries SCX's address and 0xFF"
evidence = "measured"
how = "The netlist: tests/render_edge.rs checks every strobe of its sweep (transcription-render-edge, 638 ROMs): 181,606 SCX writes in 154 of them, all rising at h = 1 (mod 8) after an edge on SCX's address with 0xFF and lasting three edges. Ceres: the mixer's SCX after each unit (a temporary trace) over the 134 ROMs that write SCX on a visible line (gambatte's scx_during_m3, mealybug's m3_scx, gbmicrotest), paired in order with the netlist's strobes: all 184,785 writes that change the low bits (110,344 in mode 3) reach the mixer two half dots before the strobe rises; ceres's write lands for the fetcher at H - 5 and cpu_bus::write holds the mixer's low bits a T-cycle more. The netlist's dot clock starts at h = 167 (= 7 mod 8), so no strobe rises with it (background::relation::writes)."
rests_on = ["readable-model-is-dmg-sim"]

[mode3-end-background]
title = "On a line where the window is idle, but line 0 after the LCD is turned on, render's mode 0 rises a half dot after ceres's pixel pipeline ends mode 3 (HBlankStart, the dot after its position reaches 160), whatever SCX is and whenever the CPU writes it, with any objects at X 8 or more while LCDC's object bit holds"
evidence = "proved"

[mode3-window-armed]
title = "On a line where the window is armed (LCDC's bit 5 set, WY matched in the frame on both sides, WX held between 0 and 165), ceres's mode 3 loop and render's pipeline stay related dot by dot while ceres's window check is short of WX, whatever SCX is and whenever the CPU writes it, with any objects at X 8 or more while LCDC's object bit holds: neither side starts the window before"
evidence = "proved"

[mode3-window-start]
title = "On a line where the window is armed (LCDC's bit 5 set, WY matched in the frame on both sides, WX held between 0 and 165) and the objects are off, ceres's mode 3 loop and render's pipeline stay related dot by dot from ceres's window check at WX, through the nine dots of the window's start and inside the window (at WX 0, the lead-in too, whatever SCX is and whenever the CPU writes it, but as wx0-lead-in-matches leaves out), and render's mode 0 rises a half dot after ceres's loop ends mode 3"
evidence = "proved"

[wx0-lead-in-matches]
title = "On a line where the window starts at WX 0 before SCX's discard, the lead-in that runs in the window matches SCX by its eighth pixel: at -9 the mixer's SCX has its low bits at 7"
evidence = "open"
how = "Otherwise the netlist's fine scroll waits at 7 for a match, where ceres's lead-in starts again (window-wx-0-lead-in-unmatched): the mode 3 relation takes the case out of its steps (background::relation::lead_in_matches). It needs SCX written as the lead-in runs in the window; no ROM of the sweep does."
facts = ["window-wx-0-lead-in-unmatched"]

[mode3-hooks-keep-pace]
title = "What ceres's mode 3 loop asks of the PPU (its hooks: the fetchers' reads, the object's row, the pixels, the HBlank source) leaves the display's pace as it was, and changes of what the loop reads back only the tile the fetcher holds"
evidence = "typed"
how = "The hooks are PpuCore's (`impl Mode3Ppu for PpuCore`), and get the pace as `&Pace`: the pace is Ppu's, beside its core, and the loop takes the two apart (`mode3(&mut self.core, &mut self.pace, state)`). Besides the pace, the loop reads LCDC's object and window bits, WX, the mixer's SCX and the hardware, which no hook writes, and what the fetcher read (`Mode3Ppu::fetcher`), which the proofs' fetcher read and object push set to anything (`relation::Mode3Loop`)."

[resync-only-in-line-0]
title = "The pixel pipeline's line-end resync moves ceres's clock only in line 0 after the LCD is turned on (895 to 893); on the other lines it finds 893"
evidence = "measured"
how = "The traces of 169 gbmicrotest LCD ROMs, against ceres's clock at each resync."

[scan-latches-equal-at-start]
title = "OAM's latches hold the same Y in the netlist and in ceres as a scan starts: the line before's last read or sprite fetch"
evidence = "measured"
how = "hdl/probes/dma_fetch.asm: all 1666 sprite fetches during a DMA take the same byte; Gambatte's late_sp scans agree with the model in every scan."
rests_on = ["readable-model-is-dmg-sim"]

# Differences the facts record, and what the CPU cannot see

[timer-known-differences]
title = "The timer's two known differences: a tick lost during the reload, and an overflow unseen after it"
evidence = "fact"
how = "timing/bisim.rs, known_difference: the harness leaves those M-cycles out."
facts = ["tima-reload-tick", "tima-reload-unseen-overflow"]

[timer-enable-race-outcome]
title = "Enabling the timer with TAC does not count the race's tick, as on the DMG ceres follows"
evidence = "fact"
how = "`related` requires enable_race_counts = false: with it true, a TAC write that enables the timer while its select changes counts (Kani's counterexample, every field free)."
facts = ["timer-enable-race"]

[lcd-on-lyc0-invisible]
title = "With LYC 0, its enable on and the flag clear, ceres raises the STAT line an M-cycle before the netlist as the LCD is turned on, which the CPU cannot see"
evidence = "measured"
how = "hdl/probes/lcd_on_lyc0.asm enters the handler after the same instruction on the model and on ceres."

# What the proofs prove for each other

[if-sees-rises-by-t-cycle]
title = "A source's rise in a T-cycle of ceres reaches IF as the netlist's in the phases that T-cycle maps to"
evidence = "proved"

[timer-step-agrees]
title = "timing::relation::step_agrees holds for every argument: from every related pair of timers, an M-cycle agrees and leaves them related, but where a fact parts them"
evidence = "proved"

[if-step-agrees]
title = "interrupts::relation::step_agrees holds for every argument: from equal IF and IE, an M-cycle with any rises, the timer's interrupt and the STAT line's rises agrees and leaves them equal"
evidence = "proved"

[dma-step-agrees]
title = "memory::dma::relation::step_agrees holds for every argument: from every related pair of OAM DMAs, an M-cycle agrees and leaves them related"
evidence = "proved"

[lcd-step-agrees]
title = "ppu::display::timing::relation::step_agrees holds for every argument: from every related pair of line timings at an M-cycle's boundary (the LCD on, off, or in line 0 after it was turned on), an M-cycle with an access to STAT, LY, LYC or LCDC, and mode 3 ending at any half dot (the HBlank source), agrees and leaves them related"
evidence = "proved"

[blocks-in-sequence]
title = "Ceres's M-cycle of the timer and IF, run T-cycle by T-cycle, is the timer's step and then IF's, the timer's request in its T-cycle"
evidence = "proved"

[dma-runs-is-netlist-run]
title = "Dma::runs is the netlist's run, after the CPU's access and after the M-cycle, a restart included"
evidence = "proved"

[search-keeps-first-ten]
title = "Ceres's object search keeps the first ten sprites on the line: a step adds a sprite when it is on the line and the list has room"
evidence = "proved"

[scan-step-agrees]
title = "ppu::display::objects::relation::step_agrees holds for every argument: from every pair related at a window of the OAM scan (2 to 38), the netlist's four edges and ceres's read of the next sprite leave the pair related at the next window"
evidence = "proved"

[scan-lead-in-agrees]
title = "ppu::display::objects::relation::lead_in_agrees holds for every argument: from the line's end, the scan's first windows leave the pair related at window 2"
evidence = "proved"

[scan-tail-agrees]
title = "ppu::display::objects::relation::tail_agrees holds for every argument: from a pair related at window 39, the netlist's scan stops with ceres's first ten sprites in its slots"
evidence = "proved"

# What the proofs leave out

[scan-match-only-in-the-store]
title = "What the OAM scan matches for a sprite reaches only the object store: neither the CPU's locks nor the display's state and sleeps"
evidence = "typed"
how = "add_object_from_index hands the match to ObjectSearch::consider, which takes the store (Pace::objs) alone; the rest of add_object_from_index reads OAM through its latches and the DMA's bus and returns, with no write of the locks (CpuAccess) or of the pace's state and wait."

[locks-with-mode-0-pulse]
title = "On a line where a sprite at X 167 pulses mode 0 before mode 3 ends, ceres's accesses to VRAM and OAM come out as the netlist's, as on the other lines"
evidence = "measured"
how = "Ceres's locks fall 2 units before HBlankStart on every line (ppu::display::proofs; 256 of its test's 73,728 lines pulse); its timing unit takes the pulse as mode 3's end, so the gate tests set such lines apart. On NetChip (ceres-netlist's tests/mode0_pulse.rs: Gambatte's 10 DMG ROMs with a sprite at X 167, 124 pulses) render's mode 3 latch (XYMU) stays up through every pulse and falls 13, 35 or 109 edges later. hdl/probes/vram_sweep.asm reads and writes VRAM and OAM across mode 3's end on such lines, SCX 0 to 3 (every alignment of the fall) and ten M-cycles of delay; the lockstep oracle runs it on ceres and NetChip side by side: all 208,693 accesses the same, the writes read back."
facts = ["sprite-at-167-mode-0-pulse"]

[locks-with-wx-166-glitch]
title = "On a line where the WX 166 glitch signals mode 3's end early, ceres's accesses to VRAM and OAM come out as the netlist's"
evidence = "open"
how = "Ceres's mode 3 loop ends mode 3 for the timing unit early there (wx_166_interrupt_glitch), as for a sprite at X 167, while its locks fall at the real end. No ROM of the gate tallies, nor the sweep, has such a line."
facts = ["sprite-at-167-mode-0-pulse"]

[dmg-lines-not-cut]
title = "No DMG line is cut off by the 456-dot abort (Mode3Abort), which skips mode3_done and the next line's scan, so that the CPU's locks would stay on"
evidence = "open"
how = "A visible line's mode 3 starts 89 dots in (cycles_for_line at MODE2_LENGTH + 4 and two sleeps), and on the DMG ends within 160 dots, SCX's 7, the window's 6 and ten sprites' 11 each: 372 dots, short of 456. The bound is the mode 3 proofs' for what they cover (mode3-end-background), not yet for objects at X 0 to 7 or the window with objects."

[cpu-does-not-address-oam]
title = "The CPU does not address OAM (FExx) during the OAM scan"
evidence = "fact"
how = "Its read strobe opens OAM's first latches, and its address holds off the precharge (oam.vhd); the scan's harnesses leave it out. What the CPU's own access comes to is measured (ceres-test-runner's tests/oam_gate.rs: a read takes FF and a write is lost in mode 2, as in the netlist); what it does to the scan is the OAM corruption bug, which ceres runs as SameBoy does and dmg-sim's plain SRAM cannot show."
facts = ["oam-corruption-bug"]

# The CPU

[sm83-settles-in-one-pass]
title = "From a core settled in the phase before, with the NMI's latches at rest, a phase's edges and one pass of the core's latches and wires settle it, and so does one pass once the memory drives the bus: a second changes neither the core nor what it gives out; and a phase with the clocks and the bus of the phase before (C, D, F, H) finds the core settled for them"
evidence = "proved"

[sm83-memory-as-the-chip-drives-it]
title = "The core's harnesses drive its data bus as NetChip does for an address the chip does not decode: the memory's byte while the core's read is up, and the phase after; the oscillator stable, no reset, no test mode; at IE's address (FFFF) the core's own register answers, and the memory leaves the bus alone"
evidence = "measured"
how = "ceres-core's sm83::cosim runs sm83::relation's M-cycle on a memory of random bytes: every opcode but HALT, STOP and the eleven that are not instructions, and the 256 after the CB prefix, from 400 random states each (199,583 runs, the 17 with an access at FFFF left out): the accesses and the registers are ceres's. The interrupts' co-simulation answers FFFF from IE on both sides (2,900 runs touch it)."
rests_on = ["transcription-sm83"]

[sm83-requests-at-e]
title = "IF's lines change only as phase E starts, and the CPU's accesses compared do not reach IF's address"
evidence = "open"
how = "The core takes IF's lines through its request latch, open in phases A to D, so a change anywhere in A to D acts as one at the E edge before, and one in E to H as one at the next. Ceres finds IF as the E edge before its step's fetch has it (mapping-m-cycle-at-e). An access to IF (FF0F) is the IF block's (if-step-agrees), which the composition takes. Co-simulated in interrupts_agree_with_the_core."

[sm83-not-stopped]
title = "The core is not stopped while the CPU is compared"
evidence = "open"
how = "STOP stops the oscillator: its step and its wake-up are the clock block's and the joypad's as much as the CPU's (ceres's leaves through P1 and resets the divider), and belong to their composition."
