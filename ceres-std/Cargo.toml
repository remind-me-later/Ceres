[package]
name = "ceres-std"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies.audioadapter]
version = "*"

[dependencies.audioadapter-buffers]
version = "*"

[dependencies.bytemuck]
version = "*"
default-features = false

[dependencies.ceres-core]
path = "../ceres-core"

[dependencies.clap]
version = "*"
default-features = false
features = ["derive", "help", "std"]
optional = true

[dependencies.cpal]
version = "*"

[dependencies.gilrs]
version = "*"

[dependencies.image]
version = "*"
default-features = false
features = ["webp"]
optional = true

[dependencies.ringbuf]
version = "*"
default-features = false
features = ["std"]

[dependencies.rubato]
version = "*"
default-features = false

[dependencies.rustyline]
version = "*"
default-features = false
features = ["with-file-history"]
optional = true

[dependencies.spin_sleep]
version = "*"
default-features = false

[dependencies.thread-priority]
version = "*"
default-features = false

[dependencies.wgpu]
version = "*"
default-features = false
features = ["dx12", "metal", "vulkan", "wgsl"]
optional = true

[dev-dependencies.pollster]
version = "*"
default-features = false

[features]
cli = ["dep:clap"]
# A console debugger in the terminal (`GbThread::start_debugger`).
debugger = ["ceres-core/debug", "dep:rustyline"]
game_genie = ["ceres-core/game_genie"]
screenshot = ["dep:image"]
wgpu_renderer = ["dep:wgpu"]

[lints]
workspace = true
